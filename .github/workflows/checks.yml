name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check cdp-supervisor.mjs
          node --check quota-net-patch.cjs
          node --check quota-gate.cjs
        shell: pwsh
      - name: Net patch self-test
        run: node cdp-supervisor.mjs --self-test-net --net-patch quota-net-patch.cjs
        shell: pwsh
